<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Richieste Fly Gym</title>
  <meta name="description" content="Invia una richiesta a Fly Gym per prove gratuite, rinnovi, iscrizioni e informazioni.">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #101016; }
    body { min-height: 100vh; color: #f5f5f7; font-family: Arial, Helvetica, sans-serif; }
    main { width: min(920px, 100%); min-height: 100vh; margin: 0 auto; }
    [data-flygym-requests] { min-height: 780px; }
    [data-flygym-requests] > iframe { width: 100% !important; border: 0 !important; border-radius: 0 !important; }
    .fg-requests-fallback { padding: 48px 24px; text-align: center; }
    .fg-requests-fallback a { color: #ffd21c; font-weight: 800; }
  </style>

  <link rel="icon" type="image/png" sizes="32x32" href="../images/loghi/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../images/loghi/favicon-180.png">
</head>
<body>
  <main>
    <div data-flygym-requests></div>
    <script type="module" src="https://flygym-app.onrender.com/requests-embed.mjs"></script>
    <noscript>
      <p class="fg-requests-fallback"><a href="https://flygym-app.onrender.com/richieste" target="_blank" rel="noopener">Apri il modulo Fly Gym</a></p>
    </noscript>
  </main>
</body>
</html>
